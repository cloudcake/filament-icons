<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bloomIndigo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 70) scale(560 420)">
      <stop offset="0" stop-color="#4F46E5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomEmerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 560) scale(620 380)">
      <stop offset="0" stop-color="#10B981" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomSky" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 70) scale(420 280)">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <!-- Icon glyphs (24x24, stroke = currentColor) -->
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 9.5V20h5v-6h4v6h5V9.5"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-9-8.6C1.6 8.3 3.6 5 7 5c2 0 3.3 1.1 5 3 1.7-1.9 3-3 5-3 3.4 0 5.4 3.3 4 6.4C19 15.6 12 20 12 20z"/></g></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></g></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></g></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></g></symbol>
    <symbol id="i-rocket" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l-3-3c1.5-4 5-9 14-9 0 9-5 12.5-9 14zM6.5 15.5C5 17 4.5 19.5 4.5 19.5S7 19 8.5 17.5M6 12H3l2.5-3.5H9M12 18v3l3.5-2.5V15"/><circle cx="15" cy="9" r="1.6"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 19a4.5 4.5 0 0 1-.6-9A6 6 0 0 1 18 9.5a4.75 4.75 0 0 1-.5 9.5z"/></g></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M8 7l1.8-3h4.4L16 7"/><circle cx="12" cy="13.5" r="3.5"/></g></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></g></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 18v-6M12 18V5M18 18V9"/></g></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z"/></g></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></g></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8zM18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></g></symbol>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="640" fill="#090A12"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#bloomIndigo)"/>
  <rect width="1280" height="640" fill="url(#bloomEmerald)"/>
  <rect width="1280" height="640" fill="url(#bloomSky)"/>

  <!-- Left: copy -->
  <g transform="translate(80 0)">
    <rect x="0" y="150" width="210" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="18" cy="166" r="4" fill="#10B981"/>
    <text x="32" y="171" font-size="14" fill="#CBD5E1" letter-spacing="0.3">cloudcake/filament-icons</text>

    <text x="0" y="262" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">Filament</text>
    <text x="0" y="340" font-size="74" font-weight="800" fill="url(#title)" letter-spacing="-2">Select Icon</text>
    <rect x="2" y="362" width="146" height="4" rx="2" fill="url(#spectrum)"/>

    <text x="0" y="408" font-size="20" fill="#94A3B8">Icons library and icon selector field for Filament.</text>
    <text x="0" y="436" font-size="20" fill="#94A3B8">Heroicons, Tabler, Lucide, Phosphor &amp; more.</text>

    <!-- Code pill -->
    <rect x="0" y="472" width="250" height="48" rx="12" fill="#0F1120" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="20" y="502" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace">
      <tspan fill="#A5B4FC">SelectIcon</tspan><tspan fill="#64748B">::</tspan><tspan fill="#E2E8F0">make</tspan><tspan fill="#64748B">(</tspan><tspan fill="#34D399">'icon'</tspan><tspan fill="#64748B">)</tspan>
    </text>
  </g>

  <!-- Right: icon picker modal mockup -->
  <g transform="translate(640 102)" filter="url(#shadow)">
    <rect width="500" height="412" rx="28" fill="#0D0F1C" stroke="#6366F1" stroke-opacity="0.42"/>
    <circle cx="430" cy="18" r="130" fill="#4F46E5" fill-opacity="0.16"/>
    <circle cx="70" cy="380" r="150" fill="#10B981" fill-opacity="0.1"/>

    <!-- Modal header -->
    <rect x="34" y="34" width="34" height="34" rx="12" fill="#4F46E5" fill-opacity="0.28"/>
    <use xlink:href="#i-grid" href="#i-grid" x="42" y="42" width="18" height="18" color="#C7D2FE"/>
    <text x="82" y="51" font-size="16" font-weight="700" fill="#EEF2FF">Icons</text>
    <rect x="82" y="60" width="200" height="7" rx="3.5" fill="#64748B" fill-opacity="0.7"/>

    <!-- Search input -->
    <g transform="translate(34 92)">
      <rect width="432" height="44" rx="14" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45"/>
      <use xlink:href="#i-search" href="#i-search" x="16" y="13" width="18" height="18" color="#818CF8"/>
      <text x="44" y="27" font-size="14" fill="#E2E8F0">rock</text>
      <rect x="76" y="12" width="1.5" height="17" fill="#A5B4FC"/>
      <rect x="350" y="11" width="66" height="22" rx="11" fill="#1E293B"/>
      <text x="383" y="26" font-size="11" fill="#94A3B8" text-anchor="middle">18 results</text>
    </g>

    <!-- Icon set tabs -->
    <g transform="translate(34 152)" font-size="12">
      <rect width="44" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="22" y="18" fill="#94A3B8" text-anchor="middle">All</text>
      <rect x="52" width="92" height="28" rx="14" fill="#4F46E5" fill-opacity="0.34" stroke="#818CF8" stroke-opacity="0.6"/>
      <text x="98" y="18" fill="#E0E7FF" text-anchor="middle" font-weight="600">Heroicons</text>
      <rect x="152" width="66" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="185" y="18" fill="#94A3B8" text-anchor="middle">Tabler</text>
      <rect x="226" width="66" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="259" y="18" fill="#94A3B8" text-anchor="middle">Lucide</text>
      <rect x="300" width="80" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="340" y="18" fill="#94A3B8" text-anchor="middle">Phosphor</text>
    </g>

    <!-- Icon grid -->
    <g transform="translate(34 198)">
      <g fill="#111827" stroke="#FFFFFF" stroke-opacity="0.07">
        <rect x="0" y="0" width="62" height="52" rx="14"/>
        <rect x="74" y="0" width="62" height="52" rx="14"/>
        <rect x="148" y="0" width="62" height="52" rx="14"/>
        <rect x="222" y="0" width="62" height="52" rx="14"/>
        <rect x="296" y="0" width="62" height="52" rx="14"/>
        <rect x="370" y="0" width="62" height="52" rx="14"/>
        <rect x="0" y="62" width="62" height="52" rx="14"/>
        <rect x="148" y="62" width="62" height="52" rx="14"/>
        <rect x="222" y="62" width="62" height="52" rx="14"/>
        <rect x="296" y="62" width="62" height="52" rx="14"/>
        <rect x="370" y="62" width="62" height="52" rx="14"/>
        <rect x="0" y="124" width="62" height="52" rx="14"/>
        <rect x="74" y="124" width="62" height="52" rx="14"/>
        <rect x="148" y="124" width="62" height="52" rx="14"/>
        <rect x="222" y="124" width="62" height="52" rx="14"/>
        <rect x="296" y="124" width="62" height="52" rx="14"/>
        <rect x="370" y="124" width="62" height="52" rx="14"/>
      </g>

      <g color="#94A3B8">
        <use xlink:href="#i-home" href="#i-home" x="19" y="14" width="24" height="24"/>
        <use xlink:href="#i-star" href="#i-star" x="93" y="14" width="24" height="24"/>
        <use xlink:href="#i-heart" href="#i-heart" x="167" y="14" width="24" height="24"/>
        <use xlink:href="#i-bell" href="#i-bell" x="241" y="14" width="24" height="24"/>
        <use xlink:href="#i-user" href="#i-user" x="315" y="14" width="24" height="24"/>
        <use xlink:href="#i-sun" href="#i-sun" x="389" y="14" width="24" height="24"/>

        <use xlink:href="#i-bolt" href="#i-bolt" x="19" y="76" width="24" height="24"/>
        <use xlink:href="#i-cloud" href="#i-cloud" x="167" y="76" width="24" height="24"/>
        <use xlink:href="#i-camera" href="#i-camera" x="241" y="76" width="24" height="24"/>
        <use xlink:href="#i-mail" href="#i-mail" x="315" y="76" width="24" height="24"/>
        <use xlink:href="#i-lock" href="#i-lock" x="389" y="76" width="24" height="24"/>

        <use xlink:href="#i-chart" href="#i-chart" x="19" y="138" width="24" height="24"/>
        <use xlink:href="#i-folder" href="#i-folder" x="93" y="138" width="24" height="24"/>
        <use xlink:href="#i-globe" href="#i-globe" x="167" y="138" width="24" height="24"/>
        <use xlink:href="#i-calendar" href="#i-calendar" x="241" y="138" width="24" height="24"/>
        <use xlink:href="#i-sparkles" href="#i-sparkles" x="315" y="138" width="24" height="24"/>
        <use xlink:href="#i-shield" href="#i-shield" x="389" y="138" width="24" height="24"/>
      </g>

      <!-- Selected: rocket -->
      <g transform="translate(74 62)">
        <rect width="62" height="52" rx="14" fill="#1E1B4B" stroke="#818CF8" stroke-width="2"/>
        <use xlink:href="#i-rocket" href="#i-rocket" x="19" y="14" width="24" height="24" color="#E0E7FF"/>
        <circle cx="56" cy="6" r="9" fill="#6366F1" stroke="#0D0F1C" stroke-width="2"/>
        <path d="M52 6L55 9L60.5 3.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Floating icon tile -->
  <g transform="translate(1086 82) rotate(7)" filter="url(#softShadow)" opacity="0.92">
    <rect width="104" height="104" rx="26" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.42"/>
    <rect x="22" y="22" width="60" height="60" rx="18" fill="#38BDF8" fill-opacity="0.14"/>
    <use xlink:href="#i-sparkles" href="#i-sparkles" x="34" y="34" width="36" height="36" color="#7DD3FC"/>
  </g>

  <!-- Floating field preview (selected value) -->
  <g transform="translate(566 452) rotate(-6)" filter="url(#softShadow)" opacity="0.96">
    <rect width="290" height="76" rx="20" fill="#071411" stroke="#10B981" stroke-opacity="0.5"/>
    <rect x="16" y="16" width="44" height="44" rx="14" fill="#10B981" fill-opacity="0.2"/>
    <use xlink:href="#i-rocket" href="#i-rocket" x="26" y="26" width="24" height="24" color="#6EE7B7"/>
    <text x="74" y="35" font-size="13" fill="#D1FAE5" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace">Rocket</text>
    <text x="74" y="54" font-size="11" fill="#5B8F80">Heroicons · outlined</text>
    <path d="M262 34L268 40L274 34" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
